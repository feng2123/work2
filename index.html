<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行Demo - 森林·沙滩·雪原</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
        }
        #ui {
            position: fixed;
            top: 12px;
            left: 12px;
            color: #fff;
            font-size: 18px;
            font-family: sans-serif;
            text-shadow: 1px 1px 4px #000;
            z-index: 99;
        }
    </style>
</head>
<body>
<!-- ImportMap 放在脚本前面，用来解析three模块 -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  }
}
</script>

<!-- 唯一JS引入，必须加 type="module" -->
<script type="module" src="./forestScene.js"></script>
</body>
</html>
